name: Build and Release AnarchyCore

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ] # Matches v1.1, v1.1.0, v2.0, etc.
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to create GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Step 1: Build the plugin JAR
      - name: Build with Gradle
        run: ./gradlew build

      # Step 2: Save as dev build artifact
      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnarchyCore-Build
          path: build/libs/*.jar

      # Step 3: Attach built JAR to GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/AnarchyCore-*.jar
          generate_release_notes: true
